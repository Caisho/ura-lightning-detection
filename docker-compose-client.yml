version: '3.8'

services:
  # MQTT Broker (Eclipse Mosquitto)
  mqtt-broker:
    image: eclipse-mosquitto:2.0
    container_name: lightning-mqtt-broker
    ports:
      - "1883:1883"
      - "9005:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_logs:/mosquitto/log
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h localhost -t test -m 'health check' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - lightning-network
    labels:
      - "com.docker.compose.project=lightning-gpio-client"
      - "description=MQTT Broker for GPIO LED Control"

  # Raspberry Pi GPIO LED Client
  led-client:
    build:
      context: .
      dockerfile: Dockerfile.rpi-client
    container_name: lightning-led-client
    depends_on:
      mqtt-broker:
        condition: service_healthy
    environment:
      - MQTT_BROKER=mqtt-broker
      - MQTT_PORT=1883
      - MQTT_TOPIC=rpi/led/control
      - LED_PIN=18
      - PYTHONPATH=/app
    volumes:
      # Mount host GPIO devices (required for real GPIO access)
      - /dev/gpiomem:/dev/gpiomem
      - /dev/mem:/dev/mem
      # Mount source code for development
      - ./src:/app/src:ro
    privileged: true  # Required for GPIO access
    restart: unless-stopped
    networks:
      - lightning-network
    labels:
      - "com.docker.compose.project=lightning-gpio-client"
      - "description=Raspberry Pi GPIO LED Control Client"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import sys; sys.exit(0)'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: LED Server (for sending commands)
  led-server:
    build:
      context: .
      dockerfile: Dockerfile.rpi-client
    container_name: lightning-led-server
    depends_on:
      mqtt-broker:
        condition: service_healthy
    environment:
      - MQTT_BROKER=mqtt-broker
      - MQTT_PORT=1883
      - MQTT_TOPIC=rpi/led/control
      - PYTHONPATH=/app
    volumes:
      - ./src:/app/src:ro
    networks:
      - lightning-network
    profiles:
      - "server"  # Optional profile - enable with --profile server
    labels:
      - "com.docker.compose.project=lightning-gpio-client"
      - "description=LED Control Server for Testing"

networks:
  lightning-network:
    name: lightning-gpio-network
    driver: bridge

volumes:
  mosquitto_data:
    name: lightning-mosquitto-data
  mosquitto_logs:
    name: lightning-mosquitto-logs

# Usage Examples:
# 
# Start client only (default):
#   docker-compose -f docker-compose-client.yml up -d
#
# Start with server for testing:
#   docker-compose -f docker-compose-client.yml --profile server up -d
#
# Send LED command from server container:
#   docker-compose -f docker-compose-client.yml exec led-server python src/mqtt_server.py --broker mqtt-broker
#
# View client logs:
#   docker-compose -f docker-compose-client.yml logs -f led-client
#
# Stop all services:
#   docker-compose -f docker-compose-client.yml down